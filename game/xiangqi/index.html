<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中国象棋 - Xiangqi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app-container">
      <!-- Top Header -->
      <header class="game-header">
        <h1 class="game-title">中國象棋</h1>
        <p class="game-subtitle">CHINESE CHESS - VIBECODING EDITION</p>
      </header>

      <!-- Main Game Section -->
      <main class="main-layout">
        <!-- Board Area -->
        <div class="board-area">
          <div id="check-banner" class="check-banner">⚡ 将军！</div>
          <div id="game-board-container"></div>
        </div>

        <!-- Control Sidebar -->
        <aside class="side-panel">
          <!-- Game Status & Timer Card -->
          <div class="card-panel">
            <div id="turn-status" class="status-badge status-red">
              红方 (先手) 行棋
            </div>
            <div class="timer-box">
              <div class="timer-item">
                <span class="timer-label">红方用时</span>
                <span id="red-timer" class="timer-val" style="color: #ff7675"
                  >10:00</span
                >
              </div>
              <div class="timer-item">
                <span class="timer-label">黑方用时</span>
                <span id="black-timer" class="timer-val" style="color: #74b9ff"
                  >10:00</span
                >
              </div>
            </div>
          </div>

          <!-- Mode & Controls Card -->
          <div class="card-panel">
            <h2 class="card-title">⚙️ 游戏设置</h2>
            <div class="control-group">
              <div class="control-item">
                <label for="select-mode">对战模式:</label>
                <select id="select-mode">
                  <option value="pvp">双人对决 (PvP)</option>
                  <option value="pvai">人机对弈 (PvAI)</option>
                </select>
              </div>

              <div id="ai-settings" class="control-group" style="display: none">
                <div class="control-item">
                  <label for="select-player-side">玩家执棋:</label>
                  <select id="select-player-side">
                    <option value="r">执红 (先手)</option>
                    <option value="b">执黑 (后手)</option>
                  </select>
                </div>
                <div class="control-item">
                  <label for="select-difficulty">AI 难度:</label>
                  <select id="select-difficulty">
                    <option value="easy">入门 (Easy)</option>
                    <option value="medium" selected>中级 (Medium)</option>
                    <option value="hard">大师 (Hard)</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="btn-grid">
              <button id="btn-new-game" class="btn btn-primary">
                🎮 重新开始
              </button>
              <button id="btn-undo" class="btn">↩️ 悔棋</button>
              <button id="btn-hint" class="btn">💡 提示</button>
              <button id="btn-sound" class="btn" style="grid-column: span 2">
                🔊 音效: 开
              </button>
            </div>
          </div>

          <!-- History Log Card -->
          <div class="card-panel">
            <h2 class="card-title">📜 对局棋谱</h2>
            <div id="move-history-list" class="history-log"></div>
          </div>

          <!-- Captured Pieces Card -->
          <div class="card-panel">
            <h2 class="card-title">⚔️ 吃子统计</h2>
            <div
              style="
                font-size: 0.85rem;
                color: var(--text-muted);
                margin-bottom: 4px;
              "
            >
              黑方吃掉红方:
            </div>
            <div id="captured-red" class="graveyard"></div>
            <div
              style="
                font-size: 0.85rem;
                color: var(--text-muted);
                margin-top: 8px;
                margin-bottom: 4px;
              "
            >
              红方吃掉黑方:
            </div>
            <div id="captured-black" class="graveyard"></div>
          </div>
        </aside>
      </main>
    </div>

    <!-- Game Over Modal Overlay -->
    <div id="game-over-overlay" class="overlay">
      <div class="overlay-card">
        <h2 id="overlay-title" class="overlay-title">🏆 绝杀胜出！</h2>
        <p id="overlay-desc" class="overlay-desc">红方将死黑方</p>
        <button
          id="btn-restart-overlay"
          class="btn btn-primary"
          style="font-size: 1.1rem; padding: 12px 24px"
        >
          再来一局
        </button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/constants.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/board.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
